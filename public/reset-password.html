<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worklog — Reset password</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="auth">
    <div class="auth-card">
      <header class="brand brand--center">
        <h1 class="wordmark">Worklog</h1>
        <p class="tagline">choose a new password</p>
      </header>

      <form class="auth-form" id="reset-form">
        <label class="field">
          <span>New password</span>
          <input type="password" id="f-password" autocomplete="new-password" required minlength="8" />
        </label>
        <label class="field">
          <span>Confirm password</span>
          <input type="password" id="f-password-confirm" autocomplete="new-password" required minlength="8" />
        </label>
        <p class="auth-error" id="auth-error" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Set new password</button>
        <a class="link-inline" href="/login.html">← Back to sign in</a>
      </form>
    </div>
  </div>

  <script src="/reset-password.js"></script>
</body>
</html>
