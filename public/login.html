<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worklog — Sign in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="auth">
    <div class="auth-card">
      <header class="brand brand--center">
        <h1 class="wordmark">Worklog</h1>
        <p class="tagline">a running record of what got done</p>
      </header>

      <div class="segmented" role="tablist" id="mode-tabs">
        <button class="segmented-option" id="tab-login" role="tab" aria-selected="true">Sign in</button>
        <button class="segmented-option" id="tab-register" role="tab" aria-selected="false">Create account</button>
      </div>

      <div class="forgot-header" id="forgot-header" hidden>
        <button type="button" class="link-inline" id="back-link">← Back to sign in</button>
      </div>

      <form class="auth-form" id="auth-form">
        <label class="field">
          <span>Email</span>
          <input type="email" id="f-email" autocomplete="email" required />
        </label>
        <label class="field" id="password-field">
          <span class="field-label-row">
            Password <em id="pw-hint"></em>
            <button type="button" class="link-inline" id="forgot-link">Forgot password?</button>
          </span>
          <input type="password" id="f-password" autocomplete="current-password" required minlength="8" />
        </label>

        <div class="auth-messages">
          <p class="auth-error" id="auth-error" hidden></p>
          <p class="auth-info" id="auth-info" hidden></p>
          <button type="button" class="link-inline" id="resend-btn" hidden>Resend verification email</button>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Sign in</button>
      </form>
    </div>
  </div>

  <a class="bmc-button" href="https://buymeacoffee.com/avinag" target="_blank" rel="noopener" title="Buy me a coffee">
    <img src="/buy-me-a-coffee.png" alt="Buy me a coffee" />
  </a>

  <script src="/auth.js"></script>
</body>
</html>
