<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worklog</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1 class="wordmark">Worklog</h1>
        <p class="tagline">a running record of what got done</p>
      </div>
      <div class="topbar-actions">
        <span class="account-email" id="account-email"></span>
        <button type="button" class="btn btn-ghost" id="logout-btn">Sign out</button>
      </div>
    </header>

    <div class="section-nav-bar">
      <div class="segmented segmented--sm" id="section-nav" role="group" aria-label="Section">
        <button type="button" class="segmented-option" data-section="log" aria-pressed="true">Log</button>
        <button type="button" class="segmented-option" data-section="todos" aria-pressed="false">Todos</button>
      </div>
    </div>

    <main class="ledger" id="view-log">
      <div class="ledger-bar">
        <div class="segmented segmented--sm" id="view-toggle" role="group" aria-label="Entry view">
          <button type="button" class="segmented-option" data-view="list" aria-pressed="true">List</button>
          <button type="button" class="segmented-option" data-view="cards" aria-pressed="false">Cards</button>
        </div>
      </div>
      <div id="log-content"><p class="empty">Loading…</p></div>
    </main>

    <main class="ledger" id="view-todos" hidden>
      <div class="notepad" id="notepad"></div>
    </main>

    <footer class="app-footer">
      <a class="gh-link" href="https://github.com/Av1nag/worklog-app" target="_blank" rel="noopener">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span class="gh-repo"><span>Av1nag</span>/worklog-app</span>
      </a>
      <p class="app-footer-note">Free &amp; open source</p>
    </footer>
  </div>

  <button type="button" class="btn btn-primary fab" id="new-entry-btn">
    <svg class="fab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
    New entry
  </button>

  <dialog class="entry-dialog" id="entry-dialog">
    <form id="entry-form">
      <div class="dialog-head">
        <h2 id="entry-dialog-title">New entry</h2>
        <button type="button" class="icon-btn" id="entry-close" aria-label="Close">✕</button>
      </div>

      <div class="dialog-body">
        <div class="field-grid">
          <label class="field">
            <span>Date</span>
            <input type="date" id="f-date" required />
          </label>
          <label class="field">
            <span>Complexity</span>
            <select id="f-complexity">
              <option value="None">None</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>Task</span>
          <input type="text" id="f-task" placeholder="Short summary of what you worked on" required />
        </label>

        <label class="field">
          <span>What I did <em>(one line each)</em></span>
          <textarea id="f-did" rows="4" placeholder="Break the work into steps&#10;One line each"></textarea>
        </label>

        <label class="field">
          <span>Issue / blocker</span>
          <textarea id="f-issue" rows="2" placeholder="What got in the way, if anything"></textarea>
        </label>

        <label class="field">
          <span>Solution</span>
          <textarea id="f-solution" rows="2" placeholder="How it was resolved"></textarea>
        </label>

        <label class="field">
          <span>Collaboration <em>(only if notable)</em></span>
          <textarea id="f-collab" rows="4" placeholder="Who was involved&#10;What was discussed or decided&#10;Anything you're waiting on&#10;Who reviewed or signed off"></textarea>
        </label>
        <label class="field">
          <span>Win of the day <em>(optional)</em></span>
          <input type="text" id="f-win" placeholder="Something that went well" />
        </label>
      </div>

      <div class="dialog-foot">
        <button type="button" class="btn btn-ghost" id="entry-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="entry-submit">Add entry</button>
      </div>
    </form>
  </dialog>

  <a class="bmc-button" href="https://buymeacoffee.com/avinag" target="_blank" rel="noopener" title="Buy me a coffee">
    <img src="/buy-me-a-coffee.png" alt="Buy me a coffee" />
  </a>

  <script src="/app.js"></script>
</body>
</html>
